name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de relancer le déploiement à la main

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro
        uses: withastro/action@v3
        with:
          node-version: 22 # Astro 7 exige Node >= 22.12 (l'action utilise 20 par défaut)
        # Site généré pour la racine "/" (domaine nidenvol.fr).
        # Pour re-tester sur l'URL github.io en sous-dossier, remettre :
        #   env:
        #     BASE_PATH: /nidenvol-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
