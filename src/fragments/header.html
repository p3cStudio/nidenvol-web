<style>
	/* ===== Header custom Nid'Envol (indépendant d'Elementor) ===== */
	.nv-header {
		position: sticky;
		top: 0;
		z-index: 1000;
		font-family: 'Poppins', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
	}

	.nv-header * {
		box-sizing: border-box;
	}

	.nv-header a {
		text-decoration: none;
	}

	/* Barre du haut */
	.nv-topbar {
		background: #FAB42F;
		color: #fff;
		font-size: 14px;
	}

	.nv-topbar-inner {
		max-width: 1280px;
		margin: 0 auto;
		padding: 7px 24px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 16px;
	}

	.nv-topbar-tag {
		font-weight: 600;
		letter-spacing: .2px;
	}

	.nv-topbar-links {
		display: flex;
		align-items: center;
		gap: 20px;
	}

	.nv-topbar-links a {
		color: #fff;
		display: inline-flex;
		align-items: center;
		gap: 7px;
		font-weight: 500;
		opacity: .95;
		transition: opacity .15s;
	}

	.nv-topbar-links a:hover {
		opacity: 1;
		text-decoration: underline;
	}

	.nv-fb {
		width: 26px;
		height: 26px;
		justify-content: center;
		border: 1px solid rgba(255, 255, 255, .7);
		border-radius: 50%;
	}

	.nv-fb:hover {
		background: rgba(255, 255, 255, .18);
		text-decoration: none !important;
	}

	/* Barre principale */
	.nv-main {
		background: #fff;
		box-shadow: 0 2px 14px rgba(20, 40, 60, .08);
	}

	.nv-main-inner {
		max-width: 1280px;
		margin: 0 auto;
		padding: 10px 24px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 24px;
	}

	.nv-logo {
		display: inline-flex;
		flex: 0 0 auto;
	}

	.nv-logo img {
		height: 88px;
		width: auto;
		display: block;
	}

	.nv-menu {
		display: flex;
		align-items: center;
		gap: 26px;
	}

	.nv-nav {
		display: flex;
		align-items: center;
		gap: 22px;
		flex-wrap: nowrap;
	}

	.nv-nav a {
		color: #4b6a72;
		font-size: 15px;
		font-weight: 500;
		white-space: nowrap;
		position: relative;
		padding: 6px 0;
		transition: color .15s;
	}

	.nv-nav a::after {
		content: "";
		position: absolute;
		left: 0;
		right: 100%;
		bottom: 0;
		height: 2px;
		background: #EB668D;
		transition: right .22s ease;
	}

	.nv-nav a:hover {
		color: #539FA7;
	}

	.nv-nav a:hover::after {
		right: 0;
	}

	.nv-only-mobile {
		display: none;
	}

	.nv-cta {
		background: #EB668D;
		color: #fff !important;
		font-weight: 600;
		font-size: 15px;
		padding: 11px 22px;
		border-radius: 9px;
		white-space: nowrap;
		box-shadow: 0 3px 10px rgba(235, 102, 141, .35);
		transition: background .18s, transform .18s;
	}

	.nv-cta:hover {
		background: #539FA7;
		transform: translateY(-1px);
	}

	/* Hamburger (mobile) */
	.nv-nav-toggle {
		display: none;
	}

	.nv-burger {
		display: none;
		flex-direction: column;
		justify-content: center;
		gap: 5px;
		width: 44px;
		height: 44px;
		cursor: pointer;
		flex: 0 0 auto;
	}

	.nv-burger span {
		display: block;
		height: 3px;
		width: 26px;
		background: #539FA7;
		border-radius: 3px;
		transition: transform .25s, opacity .2s;
	}

	@media (max-width:1080px) {
		.nv-burger {
			display: flex;
		}

		.nv-main-inner {
			position: relative;
		}

		.nv-menu {
			position: absolute;
			top: 100%;
			left: 0;
			right: 0;
			flex-direction: column;
			align-items: stretch;
			gap: 0;
			background: #fff;
			box-shadow: 0 12px 20px rgba(20, 40, 60, .12);
			border-top: 1px solid #eef1f4;
			max-height: 0;
			overflow: hidden;
			transition: max-height .3s ease;
		}

		.nv-nav {
			flex-direction: column;
			align-items: stretch;
			gap: 0;
			width: 100%;
		}

		.nv-nav a {
			padding: 15px 24px;
			border-bottom: 1px solid #f1f3f6;
			font-size: 16px;
		}

		.nv-nav a::after {
			display: none;
		}

		.nv-only-mobile {
			display: block;
		}

		.nv-cta {
			margin: 16px 24px;
			text-align: center;
		}

		.nv-nav-toggle:checked~.nv-menu {
			max-height: 520px;
		}

		.nv-nav-toggle:checked~.nv-burger span:nth-child(1) {
			transform: translateY(8px) rotate(45deg);
		}

		.nv-nav-toggle:checked~.nv-burger span:nth-child(2) {
			opacity: 0;
		}

		.nv-nav-toggle:checked~.nv-burger span:nth-child(3) {
			transform: translateY(-8px) rotate(-45deg);
		}
	}

	@media (max-width:560px) {
		.nv-topbar-tag {
			display: none;
		}

		.nv-topbar-inner {
			justify-content: center;
		}

		.nv-logo img {
			height: 48px;
		}
	}
</style>
