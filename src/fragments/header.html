<style>
	/* ===== Header custom Nid'Envol (indépendant d'Elementor) ===== */
	.nv-header {
		position: sticky;
		top: 0;
		z-index: 1000;
		font-family: 'Poppins', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
	}

	.nv-header * {
		box-sizing: border-box;
	}

	.nv-header a {
		text-decoration: none;
	}

	/* Barre du haut */
	.nv-topbar {
		background: #FAB42F;
		color: #fff;
		font-size: 14px;
	}

	.nv-topbar-inner {
		max-width: 1280px;
		margin: 0 auto;
		padding: 7px 24px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 16px;
	}

	.nv-topbar-tag {
		font-weight: 600;
		letter-spacing: .2px;
	}

	.nv-topbar-links {
		display: flex;
		align-items: center;
		gap: 20px;
	}

	.nv-topbar-links a {
		color: #fff;
		display: inline-flex;
		align-items: center;
		gap: 7px;
		font-weight: 500;
		opacity: .95;
		transition: opacity .15s;
	}

	.nv-topbar-links a:hover {
		opacity: 1;
		text-decoration: underline;
	}

	.nv-fb {
		width: 26px;
		height: 26px;
		justify-content: center;
		border: 1px solid rgba(255, 255, 255, .7);
		border-radius: 50%;
	}

	.nv-fb:hover {
		background: rgba(255, 255, 255, .18);
		text-decoration: none !important;
	}

	/* Barre principale */
	.nv-main {
		background: #fff;
		box-shadow: 0 2px 14px rgba(20, 40, 60, .08);
	}

	.nv-main-inner {
		max-width: 1280px;
		margin: 0 auto;
		padding: 10px 24px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 24px;
	}

	.nv-logo {
		display: inline-flex;
		flex: 0 0 auto;
	}

	.nv-logo img {
		height: 88px;
		width: auto;
		display: block;
	}

	.nv-menu {
		display: flex;
		align-items: center;
		gap: 26px;
	}

	.nv-nav {
		display: flex;
		align-items: center;
		gap: 22px;
		flex-wrap: nowrap;
	}

	.nv-nav a {
		color: #4b6a72;
		font-size: 15px;
		font-weight: 500;
		white-space: nowrap;
		position: relative;
		padding: 6px 0;
		transition: color .15s;
	}

	.nv-nav a::after {
		content: "";
		position: absolute;
		left: 0;
		right: 100%;
		bottom: 0;
		height: 2px;
		background: #EB668D;
		transition: right .22s ease;
	}

	.nv-nav a:hover {
		color: #539FA7;
	}

	.nv-nav a:hover::after {
		right: 0;
	}

	.nv-only-mobile {
		display: none;
	}

	.nv-cta {
		background: #EB668D;
		color: #fff !important;
		font-weight: 600;
		font-size: 15px;
		padding: 11px 22px;
		border-radius: 9px;
		white-space: nowrap;
		box-shadow: 0 3px 10px rgba(235, 102, 141, .35);
		transition: background .18s, transform .18s;
	}

	.nv-cta:hover {
		background: #539FA7;
		transform: translateY(-1px);
	}

	/* Hamburger (mobile) */
	.nv-nav-toggle {
		display: none;
	}

	.nv-burger {
		display: none;
		flex-direction: column;
		justify-content: center;
		gap: 5px;
		width: 44px;
		height: 44px;
		cursor: pointer;
		flex: 0 0 auto;
	}

	.nv-burger span {
		display: block;
		height: 3px;
		width: 26px;
		background: #539FA7;
		border-radius: 3px;
		transition: transform .25s, opacity .2s;
	}

	@media (max-width:1080px) {
		.nv-burger {
			display: flex;
		}

		.nv-main-inner {
			position: relative;
		}

		.nv-menu {
			position: absolute;
			top: 100%;
			left: 0;
			right: 0;
			flex-direction: column;
			align-items: stretch;
			gap: 0;
			background: #fff;
			box-shadow: 0 12px 20px rgba(20, 40, 60, .12);
			border-top: 1px solid #eef1f4;
			max-height: 0;
			overflow: hidden;
			transition: max-height .3s ease;
		}

		.nv-nav {
			flex-direction: column;
			align-items: stretch;
			gap: 0;
			width: 100%;
		}

		.nv-nav a {
			padding: 15px 24px;
			border-bottom: 1px solid #f1f3f6;
			font-size: 16px;
		}

		.nv-nav a::after {
			display: none;
		}

		.nv-only-mobile {
			display: block;
		}

		.nv-cta {
			margin: 16px 24px;
			text-align: center;
		}

		.nv-nav-toggle:checked~.nv-menu {
			max-height: 520px;
		}

		.nv-nav-toggle:checked~.nv-burger span:nth-child(1) {
			transform: translateY(8px) rotate(45deg);
		}

		.nv-nav-toggle:checked~.nv-burger span:nth-child(2) {
			opacity: 0;
		}

		.nv-nav-toggle:checked~.nv-burger span:nth-child(3) {
			transform: translateY(-8px) rotate(-45deg);
		}
	}

	@media (max-width:560px) {
		.nv-topbar-tag {
			display: none;
		}

		.nv-topbar-inner {
			justify-content: center;
		}

		.nv-logo img {
			height: 48px;
		}
	}

	/* ===== Bouton custom réutilisable (pages) — assorti au header ===== */
	.nv-btn-wrap {
		text-align: center;
		margin: 10px 0;
	}

	.nv-btn {
		display: inline-block;
		background: #EB668D;
		color: #fff !important;
		font-family: 'Poppins', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
		font-weight: 600;
		font-size: 16px;
		line-height: 1;
		letter-spacing: .3px;
		padding: 16px 38px;
		border: none;
		border-radius: 10px;
		text-decoration: none;
		box-shadow: 0 4px 14px rgba(235, 102, 141, .35);
		transition: background .18s, transform .18s, box-shadow .18s;
		cursor: pointer;
	}

	.nv-btn:hover {
		background: #539FA7;
		color: #fff !important;
		transform: translateY(-2px);
		box-shadow: 0 8px 20px rgba(83, 159, 167, .38);
	}

	.nv-btn:focus-visible {
		outline: 3px solid rgba(83, 159, 167, .55);
		outline-offset: 2px;
	}

	/* ===== Titres de section (agrandis, cœurs conservés) ===== */
	.elementor-heading-title.nv-sec-title {
		font-size: clamp(30px, 4.4vw, 46px) !important;
		line-height: 1.2 !important;
		font-weight: 700 !important;
		letter-spacing: .2px;
	}

	/* Les cœurs qui encadrent les titres : proportionnés au nouveau titre */
	img[src$="eveil-et-developpement-enfants-Aubencheul-au-Bac.webp"] {
		width: auto !important;
		height: clamp(44px, 4.6vw, 62px) !important;
	}

	/* ===== Mosaïque partenaires (remplace le carousel) ===== */
	.nv-partners {
		box-sizing: border-box;
		width: 100%;
		max-width: 1040px;
		margin: 0 auto;
		display: grid;
		grid-template-columns: repeat(4, 1fr);
		gap: 22px;
		padding: 0 20px;
	}

	.nv-partners * {
		box-sizing: border-box;
	}

	.nv-partner {
		display: flex;
		align-items: center;
		justify-content: center;
		background: #fff;
		border: 1px solid #eef0f2;
		border-radius: 16px;
		padding: 22px;
		min-height: 120px;
		box-shadow: 0 4px 14px rgba(20, 40, 60, .05);
		transition: transform .18s, box-shadow .18s;
	}

	.nv-partner:hover {
		transform: translateY(-3px);
		box-shadow: 0 8px 20px rgba(20, 40, 60, .1);
	}

	.nv-partner img {
		max-width: 100%;
		max-height: 66px;
		width: auto;
		height: auto;
		object-fit: contain;
	}

	@media (max-width:900px) {
		.nv-partners {
			grid-template-columns: repeat(3, 1fr);
		}
	}

	@media (max-width:560px) {
		.nv-partners {
			grid-template-columns: repeat(2, 1fr);
			gap: 14px;
		}

		.nv-partner {
			min-height: 100px;
			padding: 16px;
		}
	}

	/* ===== Section Contact (2 colonnes, moderne) ===== */
	.nv-contact {
		max-width: 1180px;
		margin: 0 auto;
		padding: 6px 24px 24px;
		font-family: 'Poppins', 'Roboto', -apple-system, sans-serif;
		box-sizing: border-box;
	}

	.nv-contact * {
		box-sizing: border-box;
	}

	.nv-contact-titlerow {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: clamp(16px, 5vw, 70px);
		margin-bottom: 14px;
	}

	.nv-contact-title {
		color: #4d9aa4;
		font-weight: 700;
		font-size: clamp(30px, 4.4vw, 46px);
		line-height: 1.2;
		margin: 0;
	}

	.nv-contact-lead {
		text-align: center;
		max-width: 680px;
		margin: 0 auto 40px;
		color: #54606a;
		font-size: 17px;
		line-height: 1.6;
	}

	.nv-contact-grid {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 28px;
		align-items: stretch;
	}

	.nv-contact-card {
		background: #fff;
		border: 1px solid #eef0f2;
		border-radius: 22px;
		box-shadow: 0 10px 30px rgba(20, 40, 60, .07);
		padding: clamp(24px, 3vw, 38px);
		display: flex;
		flex-direction: column;
		gap: 22px;
	}

	.nv-ci-list {
		list-style: none;
		margin: 0;
		padding: 0;
		display: flex;
		flex-direction: column;
		gap: 16px;
	}

	.nv-ci-list li {
		display: flex;
		align-items: center;
		gap: 14px;
		font-size: 16px;
		color: #3f4b52;
	}

	.nv-ci-list a {
		color: #3f4b52;
		text-decoration: none;
		transition: color .15s;
	}

	.nv-ci-list a:hover {
		color: #EB668D;
	}

	.nv-ci-ico {
		flex: 0 0 auto;
		width: 44px;
		height: 44px;
		border-radius: 50%;
		background: #eef7f7;
		color: #4d9aa4;
		display: inline-flex;
		align-items: center;
		justify-content: center;
	}

	.nv-hours {
		background: #faf9f5;
		border-radius: 16px;
		padding: 18px 20px;
	}

	.nv-hours h3 {
		margin: 0 0 10px;
		color: #4d9aa4;
		font-size: 14px;
		font-weight: 700;
		text-transform: uppercase;
		letter-spacing: .4px;
	}

	.nv-hours ul {
		list-style: none;
		margin: 0;
		padding: 0;
		display: flex;
		flex-direction: column;
		gap: 8px;
	}

	.nv-hours li {
		display: flex;
		justify-content: space-between;
		gap: 12px;
		font-size: 15px;
		color: #3f4b52;
	}

	.nv-hours li span {
		font-weight: 600;
		color: #4d9aa4;
	}

	.nv-hours li.closed span {
		color: #d08290;
	}

	.nv-contact-card .nv-btn {
		align-self: flex-start;
		margin-top: auto;
	}

	.nv-contact-map {
		border-radius: 22px;
		overflow: hidden;
		box-shadow: 0 10px 30px rgba(20, 40, 60, .1);
		border: 1px solid #eef0f2;
		min-height: 430px;
	}

	.nv-contact-map iframe {
		width: 100%;
		height: 100%;
		min-height: 430px;
		border: 0;
		display: block;
	}

	@media (max-width:860px) {
		.nv-contact-grid {
			grid-template-columns: 1fr;
		}

		.nv-contact-map {
			min-height: 300px;
		}

		.nv-contact-map iframe {
			min-height: 300px;
		}
	}
</style>
